# Configuración del pipeline · Traveler Insights
# Cada sección corresponde a una fase de CRISP-ML(Q). Cambiar un valor aquí
# y volver a ejecutar el pipeline es la única forma válida de cambiar el modelo.

seed: 42

data:
  train_path: data/raw/train.csv
  # Columnas del dataset de Kaggle Traveler Insights UPTC 2026 (ver página Data de la competencia).
  # Se fijan explícitamente: la detección automática puede confundir la etiqueta con otra
  # columna de pocas categorías (p. ej. "Sitio": Tripadvisor/Foursquare).
  text_col: Comentario
  label_col: Sentimiento
  # Esquema de evaluación.
  #   cv         → predicciones fuera de pliegue: cada reseña se evalúa con un modelo que no la vio.
  #                El soporte es el dataset completo (630 neutral, 157 positivo, 22 negativo).
  #   balanced   → prueba con el mismo número de reseñas por clase (test_per_class); el resto entrena
  #   stratified → prueba que conserva la proporción de clases (test_size)
  test_split: cv
  test_per_class: 7       # ≤ mitad de la clase menor (negativo); 7 × 3 clases = 21 reseñas de prueba
  test_size: 0.2
  # Retroalimentación humana exportada de la app (workflow Train). Solo se agrega al entrenamiento.
  feedback_path: data/feedback/feedback.csv
  # Requisitos de calidad de datos (fase 2). Si no se cumplen, el pipeline se detiene.
  quality:
    min_rows: 200
    min_per_class: 20
    max_duplicate_rate: 0.20
    max_conflict_rate: 0.02   # textos idénticos con etiquetas distintas

model:
  # Rasgos léxicos de los modelos anteriores del curso (pronombres, adverbios, adjetivos,
  # personas, odio, estadísticas de palabras). Ver src/traveler_insights/core/lexical.py
  lexical_features: true
  word_ngram_range: [1, 2]
  word_min_df: 2
  char_ngram_range: [3, 5]
  char_min_df: 3
  sublinear_tf: true
  C: 4.0
  class_weight: balanced
  max_iter: 2000

evaluation:
  cv_folds: 5
  cv_repeats: 5           # repeticiones de la validación cruzada con semillas distintas (variabilidad)
  bootstrap_samples: 1000
  calibration_bins: 10
  balanced_repeats: 30    # particiones balanceadas adicionales para estimar la variabilidad del macro-F1

# Compuerta de calidad (fase 4). Si no se cumple, el modelo NO se exporta ni se despliega.
quality_gate:
  min_macro_f1: 0.50               # ajústelo al nivel aceptable para el negocio
  must_beat_dummy_by: 0.10         # macro-F1 mínimo sobre el baseline trivial
  max_regression_vs_production: 0.01  # tolerancia frente al modelo desplegado
  max_parity_error: 0.0001         # diferencia máxima sklearn vs. modelo JSON

serving:
  tau: 0.70                         # umbral de confianza para automatizar
