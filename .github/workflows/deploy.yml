# Despliegue a Vercel desde GitHub Actions (opcional).
# Úselo SOLO si no conectó el repositorio a Vercel con su integración de Git;
# si usa la integración, Vercel despliega solo y este workflow queda desactivado.
# Para activarlo: variable de repositorio DEPLOY_WITH_ACTIONS = true y secretos
# VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: vars.DEPLOY_WITH_ACTIONS == 'true'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pruebas antes de desplegar
        run: pip install -e ".[train,dev]" && pytest -q
      - name: Desplegar en Vercel
        run: |
          npm install --global vercel@latest
          vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "Desplegado en $URL" >> "$GITHUB_STEP_SUMMARY"
